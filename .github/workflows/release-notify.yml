name: Notify Telegram on Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest release)"
        default: ""
        required: false
      chats:
        description: "Send only to these chats (comma-separated, e.g. @eoliannwindowstool); empty = all configured chats"
        default: ""
        required: false
      dry_run:
        description: "Only check that the bot can reach every chat (no message is sent)"
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest

    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHATS: ${{ inputs.chats || secrets.TG_CHATS }}

    steps:
      - name: Read release details
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            jq '.release' "$GITHUB_EVENT_PATH" > release.json
          elif [ -n "$INPUT_TAG" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${INPUT_TAG}" > release.json
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > release.json
          fi
          jq -r '"Release: \(.name) (\(.tag_name)) \(.html_url)", (.assets[] | "Asset: \(.name)")' release.json

      - name: Check chats (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          IFS=',' read -r -a CHAT_ARRAY <<< "${TG_CHATS}"
          FAILED=0
          for ITEM in "${CHAT_ARRAY[@]}"; do
            CHAT_ID="$(echo "${ITEM%%:*}" | xargs)"
            [ -z "$CHAT_ID" ] && continue
            RESPONSE="$(curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/getChat" -d chat_id="${CHAT_ID}")"
            if [ "$(echo "$RESPONSE" | jq -r '.ok')" = "true" ]; then
              echo "OK: $(echo "$RESPONSE" | jq -r '.result | "\(.title) (\(.id)) forum=\(.is_forum // false)"')"
            else
              echo "::error::Cannot reach chat ${CHAT_ID}: $(echo "$RESPONSE" | jq -r '.description')"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Send Telegram notifications
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "${TG_BOT_TOKEN}" ] || [ -z "${TG_CHATS}" ]; then
            echo "::error::TG_BOT_TOKEN or TG_CHATS secret is missing."
            exit 1
          fi

          RELEASE_NAME="$(jq -r '.name // .tag_name' release.json)"
          RELEASE_TAG="$(jq -r '.tag_name' release.json)"
          RELEASE_URL="$(jq -r '.html_url' release.json)"

          # Construim textul cu newline-uri reale (Telegram HTML nu acceptă <br>)
          TEXT="$(printf '%s\n' \
            '📢 <b>Eoliann Windows Tools are o nouă versiune pe GitHub!</b>' \
            "<b>${RELEASE_NAME}</b> (tag: <code>${RELEASE_TAG}</code>)" \
            "" \
            "👉 Un set de instrumente rapid pentru Windows 11, scris în Rust, care include comenzi de administrare utile și ajustări pentru optimizare Windows 10/11." \
            "Cod gratuit și curat, fără spyware, malware sau reclame." \
            "" \
            "👉 <a href=\"${RELEASE_URL}\">Mergi la pagina noii versiuni</a>" \
          )"

          # Link-uri de descărcare după numele fișierului: setup/installer = instalare, restul .exe = portabil
          while IFS=$'\t' read -r NAME URL; do
            [ -z "$URL" ] && continue
            if echo "$NAME" | grep -qiE 'setup|installer'; then
              LABEL="Descarcă fișierul de instalare"
            else
              LABEL="Descarcă fișierul portabil"
            fi
            TEXT+=$'\n'"⬇️ <a href=\"${URL}\">${LABEL}</a>"
          done < <(jq -r '.assets[] | select(.name | test("[.](exe|msi|zip)$"; "i")) | [.name, .browser_download_url] | @tsv' release.json)

          IFS=',' read -r -a CHAT_ARRAY <<< "${TG_CHATS}"

          SENT=0
          for ITEM in "${CHAT_ARRAY[@]}"; do
            ITEM_TRIM=$(echo "$ITEM" | xargs)
            [ -z "$ITEM_TRIM" ] && continue

            ARGS=(-d parse_mode="HTML" --data-urlencode "text=${TEXT}")
            if [[ "$ITEM_TRIM" == *":"* ]]; then
              ARGS+=(-d chat_id="${ITEM_TRIM%%:*}" -d message_thread_id="${ITEM_TRIM##*:}")
            else
              ARGS+=(-d chat_id="${ITEM_TRIM}")
            fi

            RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" "${ARGS[@]}")"
            if [ "$(echo "$RESPONSE" | jq -r '.ok')" = "true" ]; then
              SENT=$((SENT+1))
              echo "Sent to ${ITEM_TRIM}"
            else
              echo "::error::Telegram rejected the message for ${ITEM_TRIM}: $(echo "$RESPONSE" | jq -r '.description')"
            fi
          done

          echo "Messages sent: ${SENT}"
          [ "$SENT" -gt 0 ]
