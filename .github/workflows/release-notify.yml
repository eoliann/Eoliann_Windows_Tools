name: Notify Telegram on Release

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message (debug mode)
        run: |
          echo ">>> Trimit mesaj catre Telegram..."
          RESPONSE=$(curl -s -w "\n%{http_code}\n" -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="📢 <b>Nou release pe GitHub!</b>%0A%0A<b>${{ github.event.release.name }}</b> (tag: ${{ github.event.release.tag_name }})%0A👉 <a href='${{ github.event.release.html_url }}'>Deschide release</a>")
          
          echo ">>> Raspuns Telegram API:"
          echo "$RESPONSE"
