name: Notify Telegram on Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
      TG_CHAT_THREAD: ${{ secrets.TG_CHAT_THREAD }}
      RELEASE_NAME: ${{ github.event.release.name || github.repository }}
      RELEASE_TAG:  ${{ github.event.release.tag_name || 'manual' }}
      RELEASE_URL:  ${{ github.event.release.html_url || format('{0}/{1}/releases', github.server_url, github.repository) }}

    steps:
      - name: Send Telegram notifications
        run: |
          TEXT="📢 <b>Nou release pe GitHub!</b>%0A%0A<b>${RELEASE_NAME}</b> (tag: <code>${RELEASE_TAG}</code>)%0A👉 <a href='${RELEASE_URL}'>Deschide release</a>"

          # Grupuri simple
          if [[ -n "${TG_CHAT_IDS}" ]]; then
            IFS=',' read -r -a CHATS <<< "${TG_CHAT_IDS}"
            for CHAT in "${CHATS[@]}"; do
              curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT}" \
                -d parse_mode="HTML" \
                --data-urlencode "text=${TEXT}"
            done
          fi

          # Grupuri cu topic
          if [[ -n "${TG_CHAT_THREAD}" ]]; then
            IFS=',' read -r -a ITEMS <<< "${TG_CHAT_THREAD}"
            for ITEM in "${ITEMS[@]}"; do
              CHAT_ID="${ITEM%%:*}"
              THREAD_ID="${ITEM##*:}"
              curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                -d message_thread_id="${THREAD_ID}" \
                -d parse_mode="HTML" \
                --data-urlencode "text=${TEXT}"
            done
          fi
