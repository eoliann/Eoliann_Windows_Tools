[package]
name = "eoliann_windows_tools_w11"
version = "1.2.0"
edition = "2021"
authors = ["Eoliann Dev"]
description = "Quick tools for Windows administration"
license = "MIT"

# Ascunde consola CMD
[package.metadata.winres]
windows_subsystem = "windows"

[dependencies]
# UI Framework
eframe = "0.32"
egui = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "4.0"
webbrowser = "0.8"
winapi = { version = "0.3", features = ["winnt", "processthreadsapi", "securitybaseapi", "shellapi", "winuser"] }
image = "0.24"
resvg = "0.45"
tiny-skia = "0.11.4"
winreg = "0.10"
sysinfo = "0.28"
hostname = "0.4"

# Pentru integrare cu Windows API (IsUserAnAdmin, ShellExecuteW, etc.)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Thread safety pentru log_output
parking_lot = "0.12"

# Pentru streaming și procesare I/O asincron
tokio = { version = "1", features = ["full"] }

# Optional: pentru encoding wide string (dacă vrei să folosești MessageBoxW, etc.)
widestring = "1.0"
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
semver = "1.0.27"

[build-dependencies]
winres = "0.1"
