[package]
name = "eoliann_windows_tools_w11"
version = "1.0.9"
summary = "Quick tools for Windows administration"
edition = "2021"
authors = ["Eoliann Dev"]
description = "Quick tools for Windows administration"
license = "MIT"

# Ascunde consola CMD
[package.metadata.winres]
windows_subsystem = "windows"

[dependencies]
# UI Framework
eframe = "0.32"
egui = "0.32"
semver = "1.0"
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
open = "5.0"


# Pentru integrare cu Windows API (IsUserAnAdmin, ShellExecuteW, etc.)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Thread safety pentru log_output
parking_lot = "0.12"

# Pentru streaming și procesare I/O asincron
tokio = { version = "1", features = ["full"] }

# Optional: pentru encoding wide string (dacă vrei să folosești MessageBoxW, etc.)
widestring = "1.0"

[build-dependencies]
winres = "0.1"
